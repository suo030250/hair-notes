name: Import Hair Notes source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-hair-notes.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v7
      - name: Restore reviewed project files
        env:
          SOURCE_ARCHIVE: 
        run: |
          python3 - <<'PYTHON'
          import base64, gzip, json, os
          from pathlib import Path
          root = Path.cwd().resolve()
          files = json.loads(gzip.decompress(base64.b64decode(os.environ['SOURCE_ARCHIVE'])))
          for relative, content in files.items():
              path = (root / relative).resolve()
              if not path.is_relative_to(root) or relative.startswith(('.git/', 'tmp/', 'output/')):
                  raise ValueError('Invalid project path')
              if relative.startswith('raw/') and relative != 'raw/README.md':
                  raise ValueError('Raw source archive must remain local')
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          print(f'Restored {len(files)} reviewed project files.')
          PYTHON
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Publish Hair Notes website, wiki and agent rules'
          git push origin HEAD:main

